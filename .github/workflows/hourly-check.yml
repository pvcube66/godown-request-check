name: Hourly check
# Starts the portal check every hour. It needs two repository secrets: SITE_URL (for example https://vivtejhostels.vercel.app) and CRON_SECRET
# (the same long random value as the CRON_SECRET setting of the website). Nothing runs without both.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the website to run the check
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$SITE_URL" && test -n "$CRON_SECRET" || { echo "SITE_URL and CRON_SECRET must be set as repository secrets"; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 120 -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/cycle"
